<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RECO for clinicians</title>
    <!--
      The opening: the RECO Coin on the desk, its ring fills, and the view goes through the dial
      into the page. The markup and timing are here so the coin is ready before the page is;
      src/intro.ts decides whether it plays and starts it.
    -->
    <style>
      #intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; pointer-events: none; display: none; }
      html.intro #intro { display: block; }
      .intro-cover, .intro-stage > * { position: absolute; }
      .intro-cover { inset: 0; background: #F2F4F6; }
      .intro-stage { position: absolute; left: 50%; top: 50%; width: clamp(170px, 32vmin, 300px); aspect-ratio: 1; translate: -50% -50%; }
      .intro-stage > * { inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
      /* The desk with a hole the size of the dial; it grows with the coin, so the page shows through the dial first. */
      .intro-sheet { inset: 20.2%; width: auto; height: auto; border-radius: 50%; box-shadow: 0 0 0 200vmax #F2F4F6; visibility: hidden; }
      .intro-shadow { inset: 88% 12% -6% 12%; width: auto; height: auto; background: radial-gradient(closest-side, rgba(23, 33, 43, 0.2), rgba(23, 33, 43, 0)); }
      .intro-coin, .intro-shadow, .intro-arc { opacity: 0; }
      .intro-arc circle { fill: none; stroke: #0F7662; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
      .intro-arc { rotate: -90deg; }

      html.intro-play .intro-coin { animation: intro-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both, intro-zoom 760ms cubic-bezier(0.32, 0, 0.67, 0) 1150ms forwards; }
      html.intro-play .intro-ring { animation: intro-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both, intro-zoom 760ms cubic-bezier(0.32, 0, 0.67, 0) 1150ms forwards, intro-out 300ms linear 1500ms forwards; }
      html.intro-play .intro-dial { animation: intro-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both, intro-zoom 760ms cubic-bezier(0.32, 0, 0.67, 0) 1150ms forwards, intro-out 260ms ease-out 1150ms forwards; }
      html.intro-play .intro-shadow { animation: intro-in 520ms cubic-bezier(0.16, 1, 0.3, 1) both, intro-out 160ms linear 1150ms forwards; }
      html.intro-play .intro-arc { animation: intro-fade 200ms linear 240ms both, intro-zoom 760ms cubic-bezier(0.32, 0, 0.67, 0) 1150ms forwards, intro-out 300ms linear 1500ms forwards; }
      html.intro-play .intro-arc circle { animation: intro-sweep 820ms cubic-bezier(0.33, 1, 0.68, 1) 260ms forwards; }
      html.intro-play .intro-sheet { animation: intro-zoom 760ms cubic-bezier(0.32, 0, 0.67, 0) 1150ms forwards, intro-show 1ms linear 1150ms forwards, intro-out 200ms linear 1710ms forwards; }
      html.intro-play .intro-cover { animation: intro-out 1ms linear 1150ms forwards; }
      /* A marker with no look of its own: when it starts, the page underneath begins its own arrival. */
      html.intro-play .intro-stage { animation: intro-mark 1ms linear 1380ms; }

      @keyframes intro-in { from { opacity: 0; scale: 0.9; } to { opacity: 1; scale: 1; } }
      @keyframes intro-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes intro-out { to { opacity: 0; } }
      @keyframes intro-show { to { visibility: visible; } }
      @keyframes intro-sweep { to { stroke-dashoffset: 25; } }
      @keyframes intro-zoom { to { transform: scale(30); } }
      @keyframes intro-mark { to { outline-color: transparent; } }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-cover"></div>
      <div class="intro-stage">
        <div class="intro-sheet"></div>
        <div class="intro-shadow"></div>
        <img class="intro-coin intro-dial" src="/intro/coin-dial.webp" alt="" width="1024" height="1024" decoding="async" />
        <img class="intro-coin intro-ring" src="/intro/coin-ring.webp" alt="" width="1024" height="1024" decoding="async" />
        <svg class="intro-arc" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49.1" pathLength="100" /></svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
